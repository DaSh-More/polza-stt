[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polza-stt"
version = "0.3.0"
description = "Параллельная транскрибация длинного аудио через Polza.ai с TUI, выбором модели и подсчётом стоимости"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Danila Shevkunov", email = "mail@dshevkunov.dev" }]
keywords = ["transcription", "stt", "speech-to-text", "whisper", "polza", "ffmpeg", "tui", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "platformdirs>=4.0",
    "readchar>=4.0",
    "rich>=13.7",
]

[project.urls]
Homepage = "https://github.com/DaSh-More/polza-stt"
Issues = "https://github.com/DaSh-More/polza-stt/issues"

[project.scripts]
polza-stt = "polza_stt.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/polza_stt"]

[tool.hatch.build.targets.sdist]
include = ["src/polza_stt", "tests", "README.md", "LICENSE"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
